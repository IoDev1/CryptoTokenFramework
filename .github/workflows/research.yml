name: Monthly research pass

on:
  schedule:
    - cron: "0 5 1 * *"        # 1st of the month 05:00 UTC; the daily refresh deploys it afterwards
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - name: Market data
        run: python3 scripts/fetch_market.py
      - name: Research pass (claude-opus-5 + web search; skipped when the secret is absent)
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          python3 scripts/research_run.py --prepare
          python3 scripts/research_run.py --api
          python3 scripts/merge_research.py
      - name: Build and commit
        run: |
          python3 scripts/build.py
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add data research scorecard/index.html
          git diff --cached --quiet || git commit -m "research: monthly pass $(date -u +%F)"
          git push
